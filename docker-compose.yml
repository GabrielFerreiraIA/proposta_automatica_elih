services:
  cotador:
    build: .
    container_name: cotador-elih
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Refino por IA desligado por padrao: o app funciona inteiro com a copy
      # de regras. Para ligar, ELIH_IA=1 e uma chave com credito.
      ELIH_IA: ${ELIH_IA:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELIH_MODELO_IA: ${ELIH_MODELO_IA:-gpt-4o-mini}
    volumes:
      # /app/assets NAO e montado de proposito: capa e logos ja vao dentro da
      # imagem, e um bind mount vazio esconderia tudo o que esta la.
      - cotador-output:/app/output

volumes:
  cotador-output:
