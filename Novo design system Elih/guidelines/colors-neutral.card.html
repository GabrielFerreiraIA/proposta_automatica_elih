<!-- @dsCard group="Colors" viewport="700x180" subtitle="Neutrals — cool slate tied to navy hue" name="Neutral scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);padding:20px;background:#fff;">
  <div style="display:grid;grid-template-columns:repeat(11,1fr);gap:6px;">
    <div style="background:var(--neutral-50);height:56px;border-radius:8px;border:1px solid var(--border-subtle)"></div>
    <div style="background:var(--neutral-100);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-200);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-300);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-400);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-500);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-600);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-700);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-800);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-900);height:56px;border-radius:8px;"></div>
    <div style="background:var(--neutral-950);height:56px;border-radius:8px;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--text-tertiary)">
    <span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span>900</span><span>950</span>
  </div>
</div>
