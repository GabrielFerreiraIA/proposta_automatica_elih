<!-- @dsCard group="Spacing" viewport="700x170" subtitle="4px base scale" name="Spacing scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);padding:20px;background:#fff;display:flex;align-items:flex-end;gap:10px;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">8</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">12</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">16</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">24</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">32</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-12);height:var(--space-12);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">48</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-16);height:var(--space-16);background:var(--navy-500)"></div><span style="font-size:10px;color:var(--text-tertiary)">64</span></div>
</div>
