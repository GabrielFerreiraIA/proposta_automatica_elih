<!-- @dsCard group="Colors" viewport="700x200" subtitle="Navy scale — brand hue H225" name="Navy scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);padding:20px;background:#fff;">
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px;">
    <div style="background:var(--navy-50);height:60px;border-radius:8px;border:1px solid var(--border-subtle)"></div>
    <div style="background:var(--navy-100);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-150);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-200);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-300);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-400);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-500);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-600);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-700);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-800);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-900);height:60px;border-radius:8px;"></div>
    <div style="background:var(--navy-950);height:60px;border-radius:8px;"></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:10px;font-size:10px;color:var(--text-tertiary);text-align:center">
    <span>50</span><span>100</span><span>150</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span style="color:var(--navy-900);font-weight:700">900·base</span><span>950</span>
  </div>
</div>
