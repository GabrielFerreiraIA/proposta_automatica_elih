<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);padding:24px;background:#fff;display:flex;flex-direction:column;gap:18px;">
  <div style="display:flex;align-items:center;gap:24px;">
    <img src="../assets/logo/elih-mark-navy-circle.png" style="width:64px;height:64px;border-radius:50%;" alt="Elih mark">
    <img src="../assets/logo/elih-seguros-wordmark-navy.png" style="height:34px;" alt="Elih Seguros wordmark">
  </div>
  <div style="background:var(--navy-900);border-radius:var(--radius-lg);padding:20px 24px;display:flex;align-items:center;">
    <img src="../assets/logo/elih-seguros-lockup-white-on-navy.png" style="height:40px;" alt="Elih Seguros lockup on navy">
  </div>
  <div style="font-size:12px;color:var(--text-tertiary);line-height:1.5">
    Mark circular: uso em avatares, favicons, selos de parceria. Wordmark: uso em navbar,
    rodapé e materiais impressos, sempre em <code>--navy-900</code> sobre claro ou branco sobre <code>--navy-900</code>/<code>--navy-950</code>.
    Área de proteção mínima: altura de um "e" minúsculo em todos os lados.
  </div>
</div>
