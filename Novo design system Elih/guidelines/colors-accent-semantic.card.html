<!-- @dsCard group="Colors" viewport="700x210" subtitle="Accent + semantic — status & highlights" name="Accent & semantic" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);padding:20px;background:#fff;display:flex;flex-direction:column;gap:14px;">
  <div style="display:flex;gap:10px;">
    <div style="flex:1;background:var(--accent-100);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--accent-700);font-weight:700;font-family:var(--font-display)">accent 100</div>
    <div style="flex:1;background:var(--accent-500);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-display)">accent 500</div>
    <div style="flex:1;background:var(--accent-700);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-display)">accent 700</div>
  </div>
  <div style="display:flex;gap:10px;">
    <div style="flex:1;background:var(--success-100);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--success-700);font-weight:700;font-size:13px">success</div>
    <div style="flex:1;background:var(--warning-100);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--warning-700);font-weight:700;font-size:13px">warning</div>
    <div style="flex:1;background:var(--danger-100);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--danger-700);font-weight:700;font-size:13px">danger</div>
  </div>
  <div style="display:flex;gap:10px;">
    <div style="flex:1;background:var(--success-500);border-radius:10px;height:44px"></div>
    <div style="flex:1;background:var(--warning-500);border-radius:10px;height:44px"></div>
    <div style="flex:1;background:var(--danger-500);border-radius:10px;height:44px"></div>
  </div>
</div>
